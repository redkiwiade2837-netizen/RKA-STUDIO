<script>
        // Simple logic to simulate gallery interaction
        const galleryLeft = document.getElementById('gallery-left');
        const galleryRight = document.getElementById('gallery-right');
        
        let currentImageSet = 1;
        const maxImageSets = 4;

        function updatePagination() {
            document.getElementById('pagination-right').textContent = `${currentImageSet}/${maxImageSets}`;
        }

        galleryLeft.addEventListener('click', () => {
            currentImageSet = currentImageSet > 1 ? currentImageSet - 1 : maxImageSets;
            updatePagination();
            // In a real implementation, this would trigger an image source swap with a fade/slide transition
            animateImages();
        });

        galleryRight.addEventListener('click', () => {
            currentImageSet = currentImageSet < maxImageSets ? currentImageSet + 1 : 1;
            updatePagination();
             // In a real implementation, this would trigger an image source swap with a fade/slide transition
            animateImages();
        });

        function animateImages() {
            const images = document.querySelectorAll('.gallery-img');
            images.forEach(img => {
                img.style.opacity = '0.5';
                setTimeout(() => {
                    img.style.opacity = '1';
                }, 150);
            });
        }
    </script>
