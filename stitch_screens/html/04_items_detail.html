<script>
        let currentImageSet = 1;
        const totalSets = 2;

        function nextImage(side) {
            // Toggle opacity classes for a simple crossfade effect
            
            const img1_1 = document.getElementById('gallery-img-1-1');
            const img1_2 = document.getElementById('gallery-img-1-2');
            const img2_1 = document.getElementById('gallery-img-2-1');
            const img2_2 = document.getElementById('gallery-img-2-2');
            const indicator = document.getElementById('page-indicator');

            if (currentImageSet === 1) {
                img1_1.classList.remove('opacity-100');
                img1_1.classList.add('opacity-0');
                img1_2.classList.remove('opacity-0');
                img1_2.classList.add('opacity-100');

                img2_1.classList.remove('opacity-100');
                img2_1.classList.add('opacity-0');
                img2_2.classList.remove('opacity-0');
                img2_2.classList.add('opacity-100');
                
                currentImageSet = 2;
                indicator.innerText = '2';
            } else {
                img1_2.classList.remove('opacity-100');
                img1_2.classList.add('opacity-0');
                img1_1.classList.remove('opacity-0');
                img1_1.classList.add('opacity-100');

                img2_2.classList.remove('opacity-100');
                img2_2.classList.add('opacity-0');
                img2_1.classList.remove('opacity-0');
                img2_1.classList.add('opacity-100');
                
                currentImageSet = 1;
                indicator.innerText = '1';
            }
        }
    </script>
