<script>
    const BACKEND_BASE_URL = 'http://localhost:5000';

    document.addEventListener('DOMContentLoaded', function() {
        const tabBtns = document.querySelectorAll('.tab-btn');
        const tabContents = document.querySelectorAll('.tab-content');

        tabBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                // Remove active class from all buttons and contents
                tabBtns.forEach(b => b.classList.remove('active'));
                tabContents.forEach(c => c.classList.remove('active'));

                // Add active class to clicked button
                btn.classList.add('active');

                // Show corresponding content
                const targetId = btn.getAttribute('data-target');
                document.getElementById(targetId).classList.add('active');
            });
        });

        // Reads product id + quantity straight off the summary panel. The
        // backend looks these up in its own catalog and computes the price
        // itself — it never trusts an amount sent from the browser.
        function getOrderItems() {
            return Array.from(document.querySelectorAll('#orderSummaryItems [data-product-id]')).map(el => ({
                id: el.getAttribute('data-product-id'),
                quantity: parseInt(el.getAttribute('data-quantity'), 10),
            }));
        }

        function setPaypalStatus(message, isError) {
            const status = document.getElementById('paypal-status');
            status.textContent = message || '';
            status.classList.toggle('text-error', !!isError);
            status.classList.toggle('text-text-muted', !isError);
        }

        if (window.paypal) {
            paypal.Buttons({
                style: { layout: 'vertical', color: 'black', shape: 'rect', label: 'pay' },

                createOrder: async function () {
                    setPaypalStatus('');
                    const response = await fetch(`${BACKEND_BASE_URL}/api/orders`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ items: getOrderItems() }),
                    });
                    const orderData = await response.json();
                    if (orderData.id) return orderData.id;
                    throw new Error(orderData?.details?.[0]?.description || 'Failed to create PayPal order.');
                },

                onApprove: async function (data, actions) {
                    const response = await fetch(`${BACKEND_BASE_URL}/api/orders/${data.orderID}/capture`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                    });
                    const orderData = await response.json();
                    const errorDetail = orderData?.details?.[0];

                    if (errorDetail?.issue === 'INSTRUMENT_DECLINED') {
                        return actions.restart();
                    }
                    if (errorDetail) {
                        setPaypalStatus(errorDetail.description || 'Payment could not be processed.', true);
                        return;
                    }

                    window.location.href = '10_order_confirmation.html';
                },

                onCancel: function () {
                    setPaypalStatus('Payment cancelled.', false);
                },

                onError: function (err) {
                    console.error('PayPal Error:', err);
                    setPaypalStatus('Something went wrong with PayPal. Please try again.', true);
                },
            }).render('#paypal-button-container');
        }
    });
</script>
