<body class="h-screen w-screen overflow-hidden flex flex-col font-body text-body bg-background text-primary">

<img alt="Architectural Drawing" class="max-h-full max-w-full object-contain grayscale opacity-80 fade-transition group-hover:opacity-70" id="drawing-img" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAae000B70Jw3TAB2sshUFlgfQGHu7JwS3mgOzmxWItPnBNfsxEN53Gna5Ip2-EXGcE41qRpnoMV09nCvT85gSxQRTnFgWQvilCDk8lO7cQrA96CU2gzlkqgkBFRV_p_UkbiHkAiGq0yeKwX4JloHQtBpxtqE60VpGGvKbsHAOtEuvkwfSRAl56xHkJXNbeLRCVlK8pfxLmXX-fldEHomwInwlSlJTeOGCIMEXsIhs1FWA0u98U3Sw_">

<!-- Bottom Bar -->
<footer class="w-full flex justify-between items-center px-page-margin py-gutter fixed bottom-0 left-0 bg-background z-50">
<div class="font-body text-body text-text-muted"><span id="photo-index" class="">1</span>/3</div>
<button class="font-body text-body uppercase tracking-wider absolute left-1/2 -translate-x-1/2 hover:underline underline-offset-4 decoration-1 cursor-pointer transition-all">Info</button>
<div class="font-body text-body text-text-muted" id="drawing-index">1/4</div>
</footer>
<script>
        // Data Arrays
        const photos = [
            "https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&q=80",
            "https://images.unsplash.com/photo-1600607687931-ceeb66d11262?auto=format&fit=crop&q=80",
            "https://images.unsplash.com/photo-1600566753086-00f18efc2291?auto=format&fit=crop&q=80"
        ];
        
        const drawings = [
            "https://images.unsplash.com/photo-1503387762-592deb58ef4e?auto=format&fit=crop&q=80",
            "https://images.unsplash.com/photo-1581094794329-c8112a89af12?auto=format&fit=crop&q=80",
            "https://images.unsplash.com/photo-1541888086925-0c1157b85e05?auto=format&fit=crop&q=80",
            "https://images.unsplash.com/photo-1503387837-b154d5074bd2?auto=format&fit=crop&q=80"
        ];

        let photoIndex = 0;
        let drawingIndex = 0;

        function updatePhoto() {
            const img = document.getElementById('photo-img');
            img.style.opacity = 0;
            setTimeout(() => {
                img.src = photos[photoIndex];
                document.getElementById('photo-index').innerText = `${photoIndex + 1}/${photos.length}`;
                img.style.opacity = 1;
            }, 300);
        }

        function updateDrawing() {
            const img = document.getElementById('drawing-img');
            img.style.opacity = 0;
            setTimeout(() => {
                img.src = drawings[drawingIndex];
                document.getElementById('drawing-index').innerText = `${drawingIndex + 1}/${drawings.length}`;
                img.style.opacity = 0.8; 
            }, 300);
        }

        function cyclePhoto() {
            photoIndex = (photoIndex + 1) % photos.length;
            updatePhoto();
        }

        function cycleDrawing() {
            drawingIndex = (drawingIndex + 1) % drawings.length;
            updateDrawing();
        }
    </script>
