<style>

<h2 class="font-section-header text-section-header uppercase mb-2" id="info-title"></h2>
<p class="font-body text-body text-on-surface-variant" id="info-desc">Selected architectural study. Highlighting the intersection of raw materiality and geometric precision.</p>

</main>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const intro = document.getElementById('intro');
            const landing = document.getElementById('landing');
            const skipBtn = document.getElementById('skip-btn');
            const introSubtitle = document.getElementById('intro-subtitle');
            const hotspots = document.querySelectorAll('.hotspot-dot');
            const infoOverlay = document.getElementById('info-overlay');
            const infoTitle = document.getElementById('info-title');

            let seq1, seq2;

            const hideIntro = () => {
                intro.style.opacity = '0';
                setTimeout(() => {
                    intro.style.display = 'none';
                    landing.style.opacity = '1';
                    landing.style.pointerEvents = 'auto';
                }, 1000);
            };

            const runSequence = () => {
                seq1 = setTimeout(() => {
                    introSubtitle.style.opacity = '1';
                }, 3000);

                seq2 = setTimeout(() => {
                    hideIntro();
                }, 6000);
            };

            runSequence();

            const skipSequence = (e) => {
                if(e) e.stopPropagation();
                clearTimeout(seq1);
                clearTimeout(seq2);
                hideIntro();
            };

            intro.addEventListener('click', skipSequence);
            skipBtn.addEventListener('click', skipSequence);

            hotspots.forEach(hotspot => {
                hotspot.addEventListener('mouseenter', (e) => {
                    const info = e.target.getAttribute('data-info');
                    infoTitle.textContent = info;
                    infoOverlay.style.opacity = '1';
                });
                hotspot.addEventListener('mouseleave', () => {
                    infoOverlay.style.opacity = '0';
                });
            });
        });
    </script>
